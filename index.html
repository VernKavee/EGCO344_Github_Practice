
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        select, input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .data-table {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Electricity Dashboard - Thailand Provinces</h1>
            <p>Year 2566 (2023)</p>
            <div class="controls">
                <select id="provinceSelect">
                    <option value="">All Provinces</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search province...">
                <button onclick="resetFilters()">Reset Filters</button>
            </div>
        </header>

        <div id="errorMessage"></div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="data-table">
            <div class="search-box"></div>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Province</th>
                        <th>Users</th>
                        <th>Residential (kWh)</th>
                        <th>Business (kWh)</th>
                        <th>EV Charging (kWh)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let usersData = [];
        let usagesData = [];
        let filteredData = [];

        async function loadData() {
            try {
                const usersResponse = await fetch('electricity_users_en.json');
                const usagesResponse = await fetch('electricity_usages_en.json');

                usersData = await usersResponse.json();
                const usagesTemp = await usagesResponse.json();
                usagesData = usagesTemp.Sheet1 || usagesTemp;

                mergeAndDisplayData();
                populateProvinceSelect();
            } catch (error) {
                showError('Error loading data: ' + error.message);
            }
        }

        function mergeAndDisplayData() {
            filteredData = usersData.map(user => {
                const usage = usagesData.find(u => u.province_code === user.province_code) || {};
                return { ...user, ...usage };
            });

            displayStats();
            displayTable(filteredData);
        }

        function displayStats() {
            const stats = {
                totalUsers: filteredData.reduce((sum, p) => sum + (p.residential_count || 0), 0),
                totalUsage: filteredData.reduce((sum, p) => sum + (p.residential_kwh || 0), 0),
                totalEVCharging: filteredData.reduce((sum, p) => sum + (p.ev_charging_count || 0), 0),
                totalProvinces: filteredData.length
            };

            const statsHtml = `
                <div class="stat-card">
                    <h3>Total Provinces</h3>
                    <div class="value">${stats.totalProvinces}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value">${stats.totalUsers.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Usage (kWh)</h3>
                    <div class="value">${(stats.totalUsage / 1e9).toFixed(2)}B</div>
                </div>
                <div class="stat-card">
                    <h3>EV Charging Stations</h3>
                    <div class="value">${stats.totalEVCharging.toLocaleString()}</div>
                </div>
            `;

            document.getElementById('statsGrid').innerHTML = statsHtml;
        }

        function displayTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(province => `
                <tr>
                    <td><strong>${province.province_name}</strong></td>
                    <td>${(province.residential_count || 0).toLocaleString()}</td>
                    <td>${(province.residential_kwh || 0).toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                    <td>${((province.small_business_kwh || 0) + (province.medium_business_kwh || 0) + (province.large_business_kwh || 0)).toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                    <td>${(province.ev_charging_kwh || 0).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function populateProvinceSelect() {
            const select = document.getElementById('provinceSelect');
            const provinces = [...new Set(usersData.map(p => p.province_name))].sort();
            provinces.forEach(province => {
                const option = document.createElement('option');
                option.value = province;
                option.textContent = province;
                select.appendChild(option);
            });
        }

        function filterData() {
            const province = document.getElementById('provinceSelect').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            filteredData = usersData.map(user => {
                const usage = usagesData.find(u => u.province_code === user.province_code) || {};
                return { ...user, ...usage };
            });

            if (province) {
                filteredData = filteredData.filter(p => p.province_name === province);
            }

            if (search) {
                filteredData = filteredData.filter(p =>
                    p.province_name.toLowerCase().includes(search)
                );
            }

            displayStats();
            displayTable(filteredData);
        }

        function resetFilters() {
            document.getElementById('provinceSelect').value = '';
            document.getElementById('searchInput').value = '';
            mergeAndDisplayData();
        }

        function showError(message) {
            document.getElementById('errorMessage').innerHTML =
                `<div class="error">${message}</div>`;
        }

        document.getElementById('provinceSelect').addEventListener('change', filterData);
        document.getElementById('searchInput').addEventListener('input', filterData);

        loadData();
    </script>
</body>
</html>
